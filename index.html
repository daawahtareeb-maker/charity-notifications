<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>بوابة المشتركين | إشعارات الجمعية</title>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
  <!-- إضافة مكتبة التنبيهات المنبثقة الأنيقة (SweetAlert2) -->
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Tajawal', sans-serif;
      background: linear-gradient(135deg, #083325, #115e45, #052218);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #333;
    }

    .hotel-card {
      background: #ffffff;
      border-radius: 20px;
      border-top: 6px solid #c5a059;
      padding: 35px 25px;
      width: 90%; 
      max-width: 380px;
      box-sizing: border-box;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
      text-align: center;
    }

    .brand-icon {
      width: 65px; 
      height: 65px;
      fill: #c5a059;
      margin-bottom: 12px;
    }

    .hotel-card h2 {
      margin: 0;
      font-weight: 700;
      font-size: 24px; 
      color: #083325;
    }

    .hotel-card .subtitle {
      margin-top: 5px;
      font-size: 15px; 
      color: #c5a059;
      font-weight: 700;
    }

    .dotted-divider {
      border-bottom: 1px dashed #cbd5e1;
      margin: 20px 0 25px 0;
    }

    .checkbox-group {
      text-align: right;
      background: #f8fafc;
      padding: 18px;
      border-radius: 12px;
      margin-bottom: 20px;
      border: 1px solid #cbd5e1;
    }

    .checkbox-label {
      display: flex;
      align-items: center;
      margin-bottom: 14px;
      cursor: pointer;
      font-size: 16px;
      color: #083325;
      font-weight: 700;
    }

    .checkbox-label:last-child {
      margin-bottom: 0;
    }

    .checkbox-label input {
      margin-left: 12px;
      transform: scale(1.3);
      accent-color: #083325;
      cursor: pointer;
    }

    .hotel-btn {
      width: 100%;
      padding: 14px;
      border: 1px solid #052218;
      border-radius: 12px;
      background: linear-gradient(180deg, #115e45 0%, #052218 100%);
      color: #ffffff;
      font-family: 'Tajawal', sans-serif;
      font-weight: 700;
      font-size: 18px; 
      cursor: pointer;
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.3);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .hotel-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.4);
    }

    .hotel-btn:disabled {
      opacity: 0.7;
      cursor: not-allowed;
      transform: none;
    }
  </style>
</head>
<body>

  <div class="hotel-card">
    <svg class="brand-icon" viewBox="0 0 24 24">
      <path d="M12 3L2 12h3v8h14v-8h3L12 3zm1 15h-2v-3h2v3zm0-5h-2v-2h2v2z"/>
    </svg>
    <h2>خدمة الإشعارات</h2>
    <div class="subtitle">حدد نوع الرسائل التي ترغب باستلامها</div>
    
    <div class="dotted-divider"></div>

    <div class="checkbox-group">
      <label class="checkbox-label">
        <input type="checkbox" id="sub-funerals" value="funerals" checked> رسائل الجنائز
      </label>
      <label class="checkbox-label">
        <input type="checkbox" id="sub-lectures" value="lectures" checked> رسائل المحاضرات والدروس
      </label>
      <label class="checkbox-label">
        <input type="checkbox" id="sub-others" value="others" checked> رسائل أخرى
      </label>
    </div>

    <button class="hotel-btn" id="subscribe-btn" onclick="requestPermission()">
      <span>تفعيل التنبيهات</span>
    </button>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getMessaging, getToken } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-messaging.js";

    const firebaseConfig = {
      apiKey: "AIzaSyA7GkE88wuFBkKdnhd1-zHzLewuOulRxZA",
      authDomain: "charity-notifications-6cd5e.firebaseapp.com",
      projectId: "charity-notifications-6cd5e",
      storageBucket: "charity-notifications-6cd5e.firebasestorage.app",
      messagingSenderId: "980119733083",
      appId: "1:980119733083:web:af2da1bc82c5c35a5ed07e",
      measurementId: "G-4HRKVLCZ0G"
    };

    const app = initializeApp(firebaseConfig);
    const messaging = getMessaging(app);

    window.requestPermission = async function() {
      const btn = document.getElementById('subscribe-btn');
      
      const vapidKey = "BOEoD5Dkg_49kYKReTj8jDFxogIRjDOdHa2fGmgvL1yP6aXSP3IZjftcXwsB_FtlIOaUYV5yrRYzTywrlgTVWfU"; 
      const appsScriptUrl = "https://script.google.com/macros/s/AKfycbx7emLwKClLEgeTBkYLzjRwaZyV3PbrTAiVRoZuaToRvfV-qdjKzWTXqd69B_BDIQz-/exec"; 

      // فحص فتح الرابط داخل متصفح الواتساب أو التطبيقات المدمجة
      const ua = navigator.userAgent || navigator.vendor || window.opera;
      const isInApp = (ua.indexOf("WhatsApp") > -1) || (ua.indexOf("FBAN") > -1) || (ua.indexOf("Instagram") > -1);
      if (isInApp) {
        Swal.fire({
          icon: 'warning',
          title: 'عذراً',
          text: 'يرجى فتح الرابط في متصفح خارجي (مثل Chrome أو Safari) عبر الضغط على النقاط الثلاث بالأعلى، وليس من داخل تطبيق الواتساب.',
          confirmButtonText: 'حسناً',
          confirmButtonColor: '#115e45'
        });
        return;
      }

      // فحص دعم المتصفح للإشعارات
      if (!('Notification' in window) || !('serviceWorker' in navigator)) {
        Swal.fire({
          icon: 'error',
          title: 'متصفح غير مدعوم',
          text: 'المتصفح الحالي الذي تستخدمه لا يدعم ميزة إشعارات الويب.',
          confirmButtonText: 'حسناً',
          confirmButtonColor: '#115e45'
        });
        return;
      }

      // فحص حالة الحظر المسبق
      if (Notification.permission === 'denied') {
        Swal.fire({
          icon: 'error',
          title: 'الإشعارات محظورة',
          text: 'لقد قمت بحظر الإشعارات مسبقاً. لتفعيلها: اضغط على أيقونة القفل (🔒) بجانب رابط الموقع في الأعلى وغير إذن الإشعارات إلى (سماح).',
          confirmButtonText: 'فهمت',
          confirmButtonColor: '#115e45'
        });
        return;
      }

      try {
        btn.disabled = true;
        
        Swal.fire({
          title: 'جاري تفعيل التنبيهات...',
          text: 'يرجى الموافقة على طلب الإشعارات إذا ظهر لك.',
          allowOutsideClick: false,
          didOpen: () => {
            Swal.showLoading();
          }
        });
        
        const permission = await Notification.requestPermission();
        
        if (permission === 'granted') {
          const registration = await navigator.serviceWorker.register('./firebase-messaging-sw.js')
            .catch(err => {
              throw new Error("SW_FAILED: " + err.message);
            });
          
          const currentToken = await getToken(messaging, { 
            vapidKey: vapidKey,
            serviceWorkerRegistration: registration 
          }).catch(err => {
            throw new Error("VAPID_FAILED: " + err.message);
          });

          if (currentToken) {
            const topics = [];
            if (document.getElementById('sub-funerals').checked) topics.push('funerals');
            if (document.getElementById('sub-lectures').checked) topics.push('lectures');
            if (document.getElementById('sub-others').checked) topics.push('others');
            topics.push('all');

            await fetch(appsScriptUrl, {
              method: 'POST',
              mode: 'no-cors',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ token: currentToken, topics: topics })
            }).catch(err => {
              throw new Error("SERVER_FAILED: " + err.message);
            });

            btn.style.background = 'linear-gradient(180deg, #2e7d32 0%, #1b5e20 100%)';
            btn.querySelector('span').innerText = 'تم التفعيل بنجاح!';
            
            Swal.fire({
              icon: 'success',
              title: 'تم بنجاح',
              text: 'تم اشتراكك في خدمة الإشعارات بنجاح.',
              confirmButtonText: 'حسناً',
              confirmButtonColor: '#15803d'
            });

          } else {
            Swal.fire({
              icon: 'error',
              title: 'خطأ',
              text: 'تعذر استخراج رمز الجهاز، أعد تحديث الصفحة وحاول مجدداً.',
              confirmButtonText: 'حسناً',
              confirmButtonColor: '#115e45'
            });
            btn.disabled = false;
          }
        } else {
          Swal.fire({
            icon: 'warning',
            title: 'تم الرفض',
            text: 'تم رفض منح إذن الإشعارات من قبل المستخدم.',
            confirmButtonText: 'حسناً',
            confirmButtonColor: '#115e45'
          });
          btn.disabled = false;
        }
      } catch (error) {
        btn.disabled = false;
        const errMessage = error.toString();
        let finalErrorText = "خطأ التشخيص: " + error.message;

        if (errMessage.includes("SW_FAILED")) {
          finalErrorText = "تعذر الوصول لملف الخدمة (firebase-messaging-sw.js). تأكد من رفعه بشكل صحيح.";
        } else if (errMessage.includes("VAPID_FAILED")) {
          finalErrorText = "مفتاح الربط (VAPID) غير صحيح أو غير مفعل.";
        } else if (errMessage.includes("SERVER_FAILED")) {
          finalErrorText = "تعذر الاتصال بخادم الجمعية. تأكد من إعدادات النشر في Apps Script.";
        }
        
        Swal.fire({
          icon: 'error',
          title: 'حدث خطأ فني',
          text: finalErrorText,
          confirmButtonText: 'حسناً',
          confirmButtonColor: '#115e45'
        });
        console.error(error);
      }
    }
  </script>
</body>
</html>
